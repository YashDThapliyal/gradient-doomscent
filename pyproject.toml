[project]
name = "doomscent"
version = "0.1.0"
description = "Gradient Doomscent: RL agents that learn to fight in Doom from pixels (ViZDoom + Freedoom)"
authors = [
    { name = "Yash Thapliyal", email = "yashdt4321@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=0.29,<1.0",
    "numpy>=1.26,<2",
    "omegaconf>=2.4.0",
    "pandas>=3.0.6",
    "sample-factory>=2.1.1",
    "vizdoom>=1.2",
]

[project.scripts]
doomscent = "doomscent.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "doomscent"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["runs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "game: tests that start a real ViZDoom game (slower)",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

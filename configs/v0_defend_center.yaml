# v0: It learns to fight. Defend the Center from pixels.
# Seed-specific configs (v0_defend_center_s1.yaml, ...) inherit from this file via `base:`.
version: v0
run_name: v0_defend_center_base
seed: 1

env:
  scenario: defend_the_center       # ViZDoom bundled scenario (cfg + wad)
  scenario_short: dtc                # used in clip filenames
  frame_skip: 4
  obs_width: 128
  obs_height: 72
  render_resolution: RES_256X144     # rendered 16:9, then area-downsampled by 2 to 128x72
  hud: false                         # policy input never shows the HUD
  labels_buffer: true                # detectors only, never fed to the policy
  automap_buffer: false
  episode_timeout: null              # null keeps the scenario's own end (2100 tics)
  doom_skill: null                   # null keeps the scenario's own skill
  game_variables: [KILLCOUNT, HEALTH, ARMOR, AMMO2, SELECTED_WEAPON, SELECTED_WEAPON_AMMO,
                   DAMAGECOUNT, DAMAGE_TAKEN, HITCOUNT, HITS_TAKEN, DEAD, ITEMCOUNT,
                   POSITION_X, POSITION_Y, ANGLE]
  ammo_variables: [AMMO2]            # an increase in any of these is an ammo pickup
  weapon_variables: []               # an increase in any of these is a weapon pickup

actions:
  heads: [turn, attack]              # v0: Defend the Center allows only turning and firing
  turn_speeds_deg_per_tic: [1.5, 4.0, 9.0]   # slow, medium, fast; each way, plus none

reward:
  kill: 1.0
  death: -1.0
  damage_dealt_per_hp: 0.01
  damage_taken_per_hp: -0.005
  health_armor_pickup_per_point: 0.005
  weapon_ammo_pickup: 0.1
  ammo_spent_per_unit: 0.0           # not in the spec's base reward; probe B tests it
  scale: 1.0                         # multiplier applied to the summed reward

seeds:
  train: {start: 0, stop: 1000000}
  heldout: {start: 900000000, stop: 900100000}
  eval_start: 900000000              # evaluation episode i uses seed eval_start + i

baseline:
  name: spin_and_shoot
  turn_choices_to_try: [1, 2, 3, 4, 5, 6]   # every turn speed and direction; best on train seeds wins
  selection_episodes: 30             # per candidate, on training seeds
  episodes: 100                      # held-out measurement
  gate_multiplier: 1.5

detectors:
  spinning:   {enabled: true, min_turn_fraction: 0.95, same_direction_fraction: 0.95, max_displacement: 64.0}
  stuck:      {enabled: true, min_forward_steps: 60, max_displacement: 16.0}
  camping:    {enabled: false, radius: 256.0, min_fraction: 0.8}   # multiplayer only
  wasted_fire: {enabled: true, min_shots: 22, max_accuracy: 0.05}
  pacifist:   {enabled: true, min_enemy_visible_steps: 50}
  suicide:    {enabled: true, rocket_weapon_slot: 5, window_steps: 8}
  reward_spike: {enabled: true, window: 100, min_history: 20, z: 4.0}   # vs the other episodes of the same checkpoint
  max_clips_per_detector: 3          # rendered clips per detector per eval; all hits go to flagged.csv

train:
  sf_env_name: doomscent_v0
  train_for_env_steps: 20000000
  num_workers: 3                     # from the throughput test (step 6): 3 seeds run concurrently
  num_envs_per_worker: 8
  learner_threads: 1                 # torch threads for the CPU learner (SF default is 1)
  batch_size: 2048
  rollout: 32
  recurrence: 32
  use_rnn: true
  rnn_type: gru
  gamma: 0.99
  learning_rate: 0.0001
  device: cpu
  checkpoint_every_env_steps: 500000
  dense_checkpoint_every_env_steps: 0   # 0 disables; 100000 for the timelapse seed
  max_wall_seconds: null             # optional wall-clock budget (throughput test)
  sf_extra_args: []                   # any further Sample Factory flags, e.g. ["--num_epochs=1"]
  wandb:
    enabled: true
    project: gradient-doomscent
    mode: offline                    # no W&B credentials on this machine; `wandb sync` later
    tags: [v0, defend_the_center]

eval:
  episodes: 100
  deterministic: true
  num_workers: 2                     # eval processes per watcher; 3 watchers share the CPU with 3 trainings
  clips_first_n: 3
  multi_kill_window_steps: 35        # kills within this many agent steps (~4 s) form a streak
  multi_kill_min: 3
  max_multi_kill_clips: 2            # render only the strongest streak episodes
  train_clip_episodes: 2
  best_clip_episodes: 3
  final_clip_episodes: 5
  step0_clip_episodes: 3
  poll_interval_s: 20

record:
  width: 1280
  height: 720
  fps: 35
  crf: 20
  minimap_size: 300                  # inset square, pixels
  minimap_trail_tics: 350            # recent path length drawn on the minimap

coverage_cell: 64

sync:
  rclone_remote: null                # e.g. "r2:gradient-doomscent"; null skips cloud sync                    # map units per coverage grid cell

timelapse:
  units_per_layer: 24                # real units sampled per layer, fixed across checkpoints
  units_seed: 0
  probe_size: 300                    # frames in the fixed probe set
  probe_context: 8                   # preceding frames fed through the GRU before each probe
  probe_low_health: 30
  probe_low_ammo: 5
  probe_close_px: 40                 # enemy bounding-box height (at 256x144) counted as close
  probe_far_px: 20
  duration_s: 60
  fps: 60
  fight_seed_offset: 0               # fight footage uses held-out seed eval_start + offset
  saliency_blur_px: 9
  umap: {n_neighbors: 15, min_dist: 0.1, seed: 0}

name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install system libraries for ViZDoom
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libboost-all-dev ffmpeg
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Tests, including a few real short episodes
        run: uv run pytest -q
